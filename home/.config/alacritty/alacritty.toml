# Shared alacritty config. Per-OS values (window decorations, font size, login
# shell) live in host.toml, linked from the `macos/` or `linux/` stow package.
# Values in this file win over imported ones, so keep host overrides out of here.

[window]
opacity = 0.85
startup_mode = "Maximized"

[font]
normal = { family = "FiraCode Nerd Font" }

[general]
import = ["~/.config/alacritty/host.toml"]
